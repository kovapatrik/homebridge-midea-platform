name: Publish to npm

on:
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
        default: latest
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        required: true
        default: beta
        type: choice
        options:
          - beta
          - next
          - latest
      version:
        description: Override package.json version (e.g. 1.4.0-beta.0), leave empty to use the committed one
        required: false
        type: string

permissions:
  id-token: write # Required for npm trusted publishing (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - name: Set version
        if: inputs.version != ''
        run: npm version "$VERSION" --no-git-tag-version
        env:
          VERSION: ${{ inputs.version }}
      - run: npm publish --tag "$TAG"
        env:
          TAG: ${{ inputs.tag || 'latest' }}
